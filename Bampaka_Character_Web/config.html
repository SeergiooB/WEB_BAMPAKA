<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Configuración del Juego</title>
</head>
<body>
    <div class="config-container">
        <h1>Configuración del Juego</h1>
        <div class="slider-container">
            <label for="volume">Volumen:</label>
            <input type="range" id="volume" min="0" max="100" value="50" class="slider">
        </div>
        <div class="slider-container">
            <label for="graphics">Gráficos:</label>
            <input type="range" id="graphics" min="1" max="10" value="5" class="slider">
        </div>
        <div style="display:flex; gap:12px; justify-content:center; margin-top:12px;">
            <a href="elige_coche.html" class="config-link-button">Elige tu coche</a>
            <button id="backButton">Volver a la Página Principal</button>
        </div>

    <!-- selected car preview removed as requested -->
    </div>
    <script src="config.js"></script>
</body>
</html>
