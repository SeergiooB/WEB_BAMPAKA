<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Configuración del Juego</title>
</head>
<body>
    <div class="config-container">
        <h1>Configuración del Juego</h1>
        <div class="slider-container">
            <label for="volume">Volumen:</label>
            <input type="range" id="volume" min="0" max="100" value="50" class="slider">
        </div>
        <div class="slider-container">
            <label for="graphics">Gráficos:</label>
            <input type="range" id="graphics" min="1" max="10" value="5" class="slider">
        </div>
        <div class="car-actions" style="margin-top:12px; display:flex; gap:12px; justify-content:center;">
            <button id="continueBtn" class="confirm-btn" onclick="location.href='elige_coche.html'">Continuar</button>
            <button id="backButton" class="confirm-btn" style="background:#be1b74;color:#fff">Volver</button>
        </div>

    <!-- selected car preview removed as requested -->
    </div>
    <script src="config.js"></script>
</body>
</html>
