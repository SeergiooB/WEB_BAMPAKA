<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Selección de mapas</title>
</head>
<body>
    <main class="car-gallery-wrap">
        <header class="car-gallery-header">
            <h1>Elige el mapa</h1>
            <p>Haz click en una carta para seleccionar el mapa.</p>
        </header>

        <section class="map-selection">
            <div class="map-grid" id="mapGrid">
                <!-- Primera tarjeta original conservada -->
                <div class="map-card" data-id="daikoku-1" data-name="Daikoku - Variante A" data-desc="Un circuito técnico de asfalto perfecto diseñado para el lucimiento visual y las persecuciones a alta velocidad. Los pilotos deben dominar las curvas continuas mientras atraviesan las icónicas estructuras de cemento y las señalizaciones de tráfico que definen el estilo de vida callejero japonés.">
                    <img src="img/mapa2.png" alt="Daikoku 1">
                    <div class="map-label">Daikoku</div>
                    <div class="sparkles"></div>
                </div>

                <!-- 1. Circuito del Gran Buda (Nara) -->
                <div class="map-card" data-id="nara-grand-buddha" data-name="Circuito del Gran Buda (Nara)" data-desc="Un trazado que rodea un antiguo templo en el corazón de Nara, donde la paz de los jardines zen se ve interrumpida por el rugido de los motores. Es el territorio sagrado de Morio, diseñado con curvas cerradas que obligan a los pilotos a mostrar una disciplina monacal para no acabar en los estanques de carpas.">
                    <img src="img/mapa7.png" alt="Circuito del Gran Buda - Nara">
                    <div class="map-label">Circuito del Gran Buda (Nara)</div>
                    <div class="sparkles"></div>
                </div>

                <!-- 2. Descenso de la Cumbre Blanca (Nagano) -->
                <div class="map-card" data-id="nagano-descent" data-name="Descenso de la Cumbre Blanca (Nagano)" data-desc="Inspirado en los gélidos Alpes Japoneses, este mapa presenta carreteras cubiertas de nieve perpetua y visibilidad reducida por la ventisca. Es el dominio de Setsuo, donde los pilotos deben equipar palas frontales para abrirse paso mientras el calor de sus motores evita que el chasis se congele en mitad de la carrera.">
                    <img src="img/mapa8.png" alt="Descenso de la Cumbre Blanca - Nagano">
                    <div class="map-label">Descenso de la Cumbre Blanca (Nagano)</div>
                    <div class="sparkles"></div>
                </div>

                <!-- 3. Odisea de Neón (Shibuya/Tokio) -->
                <div class="map-card" data-id="shibuya-neon" data-name="Odisea de Neón (Shibuya/Tokio)" data-desc="Una autopista elevada que serpentea entre rascacielos infinitos y pantallas publicitarias gigantes que emiten directos de Mirai-Q. Este mapa nocturno es pura velocidad y reflejos, con tramos rectos larguísimos donde la aerodinámica y el estilo visual cuentan tanto como la potencia del motor.">
                    <img src="img/mapa4.png" alt="Odisea de Neón - Shibuya">
                    <div class="map-label">Odisea de Neón (Shibuya/Tokio)</div>
                    <div class="sparkles"></div>
                </div>

                <!-- 4. El Mercado del Caos (Osaka) -->
                <div class="map-card" data-id="osaka-market" data-name="El Mercado del Caos (Osaka)" data-desc="Un circuito urbano frenético que atraviesa los distritos gastronómicos más concurridos, llenos de puestos de ramen y luces de neón estridentes. Es el patio de recreo de Hapa, un laberinto de asfalto estrecho donde los accidentes masivos son parte del espectáculo y el olor a neumáticos quemados se mezcla con el del fugu.">
                    <img src="img/mapa5.png" alt="El Mercado del Caos - Osaka">
                    <div class="map-label">El Mercado del Caos (Osaka)</div>
                    <div class="sparkles"></div>
                </div>

                <!-- 5. Arboleda de las Sombras (Bamboo Forest) -->
                <div class="map-card" data-id="bamboo-grove" data-name="Arboleda de las Sombras (Bamboo Forest)" data-desc="Una pista técnica que se interna en un denso bosque de bambú, donde los tallos verdes crean un túnel natural que oculta los peligros de la carretera. La luz se filtra apenas entre las cañas, creando un juego de sombras que pone a prueba la concentración de los conductores más experimentados en las carreras ilegales del clan.">
                    <img src="img/mapa6.png" alt="Arboleda de las Sombras - Bamboo Forest">
                    <div class="map-label">Arboleda de las Sombras (Bamboo Forest)</div>
                    <div class="sparkles"></div>
                </div>
            </div>

            <div id="mapDetails" class="char-details hidden" aria-live="polite">
                <div class="char-card">
                    <div class="char-thumb"><img id="mapThumb" src="" alt=""></div>
                    <div class="char-body">
                        <h2 id="mapName"></h2>
                        <p id="mapDesc"></p>
                    </div>
                </div>
            </div>

            <div class="car-actions" style="margin-top:20px;">
                <button id="confirmMapBtn" class="confirm-btn" disabled>Continuar</button>
                <button id="backToChars" class="confirm-btn" style="background:#be1b74;color:#fff">Volver</button>
            </div>
        </section>
    </main>

    <!-- Modal warning shown when user confirms map selection -->
    <div id="startWarningModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-content">
            <h3 id="modalTitle">Aviso</h3>
            <p>Aquí empezaría el juego</p>
            <div style="display:flex; gap:12px; justify-content:center; margin-top:12px;">
                <button id="modalStart" class="confirm-btn">Empezar</button>
                <button id="modalCancel" class="confirm-btn" style="background:#be1b74;color:#fff">Cancelar</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="elige_mapa.js"></script>
</body>
</html>
